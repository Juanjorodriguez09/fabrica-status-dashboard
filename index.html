<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de la fábrica</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #14171f;
    --panel-2: #1a1e29;
    --border: #262b38;
    --border-soft: #1f2330;
    --text: #eceef3;
    --text-dim: #8b92a8;
    --text-faint: #5c6377;
    --accent: #7c9bff;
    --accent-soft: rgba(124,155,255,0.12);
    --red: #ff7a7a;
    --red-soft: rgba(255,122,122,0.1);
    --amber: #ffbf6b;
    --amber-soft: rgba(255,191,107,0.1);
    --teal: #4fd6b5;
    --teal-soft: rgba(79,214,181,0.1);
    --blue: #5ec3ff;
    --blue-soft: rgba(94,195,255,0.1);
    --gray: #7c8298;
    --gray-soft: rgba(124,130,152,0.1);
    --green: #58d68d;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.24);
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel-2: #f7f8fc;
      --border: #e3e6ef;
      --border-soft: #ececf3;
      --text: #171a24;
      --text-dim: #62697e;
      --text-faint: #99a0b4;
      --accent: #4361ee;
      --accent-soft: rgba(67,97,238,0.08);
      --red: #d64545;
      --red-soft: rgba(214,69,69,0.08);
      --amber: #b3690f;
      --amber-soft: rgba(179,105,15,0.08);
      --teal: #0f8f76;
      --teal-soft: rgba(15,143,118,0.08);
      --blue: #1878b0;
      --blue-soft: rgba(24,120,176,0.08);
      --gray: #666c80;
      --gray-soft: rgba(102,108,128,0.08);
      --green: #17915a;
      --shadow: 0 1px 2px rgba(20,25,40,0.04), 0 8px 24px rgba(20,25,40,0.06);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 32px 24px 100px; }

  header {
    display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0;
  }
  h1 { font-size: 1.3rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .subtitle { font-size: 0.82rem; color: var(--text-dim); margin-top: 2px; }
  .freshness {
    display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-dim);
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px 7px 10px; white-space: nowrap;
  }
  .freshness .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .freshness.stale .dot { background: var(--amber); }
  .freshness.old .dot { background: var(--red); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .kpi .top { display: flex; align-items: center; justify-content: space-between; }
  .kpi .n { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
  .kpi .ic { font-size: 1.1rem; opacity: 0.85; }
  .kpi .l { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }
  .kpi.pausado .n { color: var(--red); }
  .kpi.pr .n { color: var(--blue); }
  .kpi.aprobar .n { color: var(--amber); }
  .kpi.nuevo .n { color: var(--accent); }
  .kpi.cierre .n { color: var(--teal); }
  .kpi.estancado .n { color: var(--gray); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px;
  }
  select, input[type="search"] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; font-family: inherit;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="search"] { min-width: 240px; flex: 1; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-dim); cursor: pointer; user-select: none; white-space: nowrap; }
  .toggle input { accent-color: var(--accent); }

  .errors {
    background: var(--red-soft); border: 1px solid var(--red); color: var(--red);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 24px; font-size: 0.85rem;
  }
  .errors strong { display: block; margin-bottom: 4px; }
  .errors ul { margin: 4px 0 0; padding-left: 18px; }

  .repo-block { margin-bottom: 36px; }
  .repo-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .repo-title .badge {
    font-size: 0.72rem; font-weight: 600; color: var(--text-dim); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 11px;
  }

  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .col {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; min-height: 72px; box-shadow: var(--shadow);
  }
  .col h3 {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    color: var(--text-dim); margin: 2px 4px 12px; display: flex; justify-content: space-between; align-items: center;
  }
  .col h3 span { background: var(--panel-2); border-radius: 999px; padding: 1px 8px; font-size: 0.68rem; }
  .col.pausado { border-top: 3px solid var(--red); }
  .col.pr { border-top: 3px solid var(--blue); }
  .col.aprobar { border-top: 3px solid var(--amber); }
  .col.nuevo { border-top: 3px solid var(--accent); }
  .col.cierre { border-top: 3px solid var(--teal); }
  .col.estancado { border-top: 3px solid var(--gray); }

  .card {
    display: block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 13px; margin-bottom: 8px; text-decoration: none; color: inherit;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
  .card .num { font-size: 0.72rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .card .title { font-size: 0.85rem; font-weight: 650; margin: 3px 0 5px; line-height: 1.32; }
  .card .motivo { font-size: 0.77rem; color: var(--text-dim); line-height: 1.4; }
  .card .fecha { font-size: 0.69rem; color: var(--text-faint); margin-top: 7px; }
  .empty-col { color: var(--text-faint); font-size: 0.78rem; padding: 8px 4px; }

  details.completado { margin-top: 12px; }
  details.completado summary {
    cursor: pointer; font-size: 0.82rem; color: var(--text-dim); font-weight: 600;
    padding: 4px 0; list-style: none;
  }
  details.completado summary::-webkit-details-marker { display: none; }
  details.completado summary::before { content: "▸ "; }
  details.completado[open] summary::before { content: "▾ "; }
  details.completado .card { margin-top: 8px; }

  .state-msg { color: var(--text-dim); padding: 60px 0; text-align: center; font-size: 0.9rem; }
  footer {
    margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border-soft);
    font-size: 0.76rem; color: var(--text-faint); text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">📋</div>
      <div>
        <h1>Estado de la fábrica de software</h1>
        <div class="subtitle">Panorama diario de todos los repos — generado automáticamente</div>
      </div>
    </div>
    <div class="freshness" id="freshness">
      <span class="dot"></span><span id="meta">cargando…</span>
    </div>
  </header>

  <div id="errors-box"></div>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <select id="filtro-repo"><option value="">Todos los repos</option></select>
    <input type="search" id="buscar" placeholder="Buscar por título o número…">
    <label class="toggle"><input type="checkbox" id="ocultar-estancado"> Ocultar estancados</label>
  </div>

  <div id="contenido"><div class="state-msg">Cargando data/estado.json…</div></div>

  <footer>Generado por la Routine <strong>reporte-diario-fabrica</strong> · datos vía GitHub API, snapshot diario</footer>
</div>

<script>
const CATS = [
  { key: "pausado_esperando_decision", label: "Pausado — esperando decisión", cls: "pausado", icon: "⏸️" },
  { key: "pr_esperando_revision_merge", label: "PR — revisión o merge", cls: "pr", icon: "🔀" },
  { key: "pendiente_de_aprobar", label: "Pendiente de aprobar", cls: "aprobar", icon: "🕓" },
  { key: "recien_abierto_sin_plan", label: "Recién abierto, sin plan", cls: "nuevo", icon: "🆕" },
  { key: "cierre_administrativo_pendiente", label: "Falta cerrar (ya mergeado)", cls: "cierre", icon: "✅" },
  { key: "estancado", label: "Estancado", cls: "estancado", icon: "🕸️" },
];

let DATA = null;

function fmtFecha(iso) {
  if (!iso) return "";
  try {
    const d = new Date(iso);
    return d.toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" });
  } catch (e) { return iso; }
}

function actualizarFrescura(iso) {
  const el = document.getElementById("freshness");
  const meta = document.getElementById("meta");
  if (!iso) { meta.textContent = "sin datos"; return; }
  const horas = (Date.now() - new Date(iso).getTime()) / 3.6e6;
  el.classList.remove("stale", "old");
  if (horas > 48) el.classList.add("old");
  else if (horas > 30) el.classList.add("stale");
  meta.textContent = "Generado " + fmtFecha(iso);
}

function card(item) {
  const icon = item.tipo === "pr" ? "🔀" : "📝";
  const motivo = item.motivo ? `<div class="motivo">${escapeHtml(item.motivo)}</div>` : "";
  const fecha = item.ultima_actividad ? `<div class="fecha">Última actividad: ${escapeHtml(item.ultima_actividad)}</div>` : "";
  return `<a class="card" href="${item.url || '#'}" target="_blank" rel="noopener">
    <div class="num">${icon} #${item.numero ?? "?"}</div>
    <div class="title">${escapeHtml(item.titulo || "(sin título)")}</div>
    ${motivo}${fecha}
  </a>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function render() {
  if (!DATA) return;
  const repoFiltro = document.getElementById("filtro-repo").value;
  const busq = document.getElementById("buscar").value.trim().toLowerCase();
  const ocultarEstancado = document.getElementById("ocultar-estancado").checked;

  const repos = DATA.repos.filter(r => !repoFiltro || r.nombre === repoFiltro);

  const totales = {};
  CATS.forEach(c => totales[c.key] = 0);
  repos.forEach(r => CATS.forEach(c => totales[c.key] += (r.categorias[c.key] || []).length));

  document.getElementById("kpis").innerHTML = CATS.map(c => `
    <div class="kpi ${c.cls}">
      <div class="top"><div class="n">${totales[c.key]}</div><div class="ic">${c.icon}</div></div>
      <div class="l">${c.label}</div>
    </div>`).join("");

  const html = repos.map(r => {
    const cols = CATS.map(c => {
      if (c.key === "estancado" && ocultarEstancado) return "";
      let items = r.categorias[c.key] || [];
      if (busq) items = items.filter(i =>
        String(i.numero).includes(busq) || (i.titulo||"").toLowerCase().includes(busq));
      const cardsHtml = items.length
        ? items.map(card).join("")
        : `<div class="empty-col">ninguno</div>`;
      return `<div class="col ${c.cls}"><h3>${c.label}<span>${items.length}</span></h3>${cardsHtml}</div>`;
    }).join("");

    const completados = r.completado_ayer || [];
    const completadosHtml = completados.length
      ? `<details class="completado"><summary>Completado ayer (${completados.length})</summary>${completados.map(card).join("")}</details>`
      : "";

    const totalAbiertos = Object.values(r.categorias).reduce((a,arr)=>a+arr.length,0);
    return `<div class="repo-block">
      <div class="repo-title">${escapeHtml(r.nombre)} <span class="badge">${totalAbiertos} abiertos</span></div>
      <div class="board">${cols}</div>
      ${completadosHtml}
    </div>`;
  }).join("");

  document.getElementById("contenido").innerHTML = html || `<div class="state-msg">Sin repos para mostrar.</div>`;
}

function poblarFiltroRepo() {
  const sel = document.getElementById("filtro-repo");
  DATA.repos.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.nombre;
    opt.textContent = r.nombre;
    sel.appendChild(opt);
  });
}

async function cargar() {
  try {
    const res = await fetch("data/estado.json", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  } catch (e) {
    document.getElementById("contenido").innerHTML =
      `<div class="state-msg">No se pudo cargar data/estado.json todavía (${escapeHtml(e.message)}).<br>Va a aparecer acá después de la primera corrida de la Routine reporte-diario-fabrica.</div>`;
    document.getElementById("meta").textContent = "sin datos";
    return;
  }

  actualizarFrescura(DATA.generado_en);

  const errores = DATA.errores || [];
  if (errores.length) {
    document.getElementById("errors-box").innerHTML =
      `<div class="errors"><strong>⚠️ Errores en la última corrida</strong><ul>${errores.map(e => `<li>${escapeHtml(e)}</li>`).join("")}</ul></div>`;
  }

  poblarFiltroRepo();
  render();

  document.getElementById("filtro-repo").addEventListener("change", render);
  document.getElementById("buscar").addEventListener("input", render);
  document.getElementById("ocultar-estancado").addEventListener("change", render);
}

cargar();
</script>
</body>
</html>
